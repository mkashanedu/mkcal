kind = "web"
previewPath = "/peadscal/"
title = "PeadsCal — Pediatric Clinical Calculator"
version = "1.0.0"
id = "artifacts/peadscal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/peadscal/" ]
localPort = 26182

[services.development]
run = "pnpm --filter @workspace/peadscal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/peadscal", "run", "build" ]
publicDir = "artifacts/peadscal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26182"
BASE_PATH = "/peadscal/"
