kind = "mobile"
previewPath = "/"
title = "PICU Drug Dose Calculator"
version = "1.0.0"
id = "artifacts/picu-drug-dose"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22385

[services.development]
run = "pnpm --filter @workspace/picu-drug-dose run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/picu-drug-dose", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/picu-drug-dose", "run", "serve" ]

[services.env]
PORT = "22385"
BASE_PATH = "/"
